version: '3.8'

# Production deployment - binds to localhost only for security
services:
  backend:
    build:
      context: ../../
      dockerfile: order-system-backend/Dockerfile
    container_name: order-system-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    env_file:
      - ../../.env.production
    volumes:
      # Persist SQLite database and uploads
      - app_data:/app/data
      - app_uploads:/app/static/uploads
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - order-network

volumes:
  app_data:
    driver: local
  app_uploads:
    driver: local

networks:
  order-network:
    driver: bridge
