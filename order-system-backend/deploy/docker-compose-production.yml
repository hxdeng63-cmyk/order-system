version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-system-backend
    ports:
      - "127.0.0.1:8088:8088"
    env_file:
      - .env
    volumes:
      - app_data:/app
      - app_uploads:/app/static/uploads
    environment:
      - PYTHONUNBUFFERED=1
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  app_data:
  app_uploads:
