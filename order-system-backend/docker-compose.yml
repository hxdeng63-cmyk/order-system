version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-system-backend
    restart: unless-stopped
    ports:
      - "8088:8088"
    env_file:
      - .env
    volumes:
      # Persist SQLite database and uploads
      - app_data:/app/data
      - app_uploads:/app/static/uploads
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - order-network

volumes:
  app_data:
    driver: local
  app_uploads:
    driver: local

networks:
  order-network:
    driver: bridge
